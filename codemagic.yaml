# Codemagic builds the iOS app on a Mac in the cloud (no own Mac needed) and the Android release bundle.
# Not run yet: it needs the owner's Codemagic account, an App Store Connect API key named
# "bridge-it-asc" in Codemagic, and an Android upload keystore named "bridge-it-upload".
# See docs/NEEDS_FROM_OWNER.md.
workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bridge-it-asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tralesmile.bridgeit
    scripts:
      - name: Install
        script: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - name: Check and build the game, copy it into the apps
        script: npm run check && npm run app:sync
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
      - name: Build the .ipa
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android release bundle (Google Play)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 22
      java: 21
      android_signing:
        - bridge-it-upload
    scripts:
      - name: Install
        script: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - name: Check and build the game, copy it into the apps
        script: npm run check && npm run app:sync
      - name: Build the .aab
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
