<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc6ff" />
    <meta name="description" content="Bridge It! Build bridges, watch them hold or hilariously collapse. A physics puzzle game." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Bridge It!</title>
    <style>
      html, body { margin: 0; height: 100%; background: #7cc6ff; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 100; background: #fff7e8; color: #2b2140; font-family: 'Fredoka Variable', system-ui, sans-serif; font-weight: 700; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; }
      #rotate svg { width: 96px; height: 96px; animation: turn 2.4s ease-in-out infinite; }
      #rotate p { margin: 0; font-size: 28px; }
      @keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; transform: rotate(-90deg); } }
      #loading { position: fixed; inset: 0; z-index: 50; background: #7cc6ff; color: #2b2140; font-family: 'Fredoka Variable', system-ui, sans-serif; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .3s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading h1 { margin: 0; font-size: 44px; }
      #loading .bar { width: min(60vw, 320px); height: 14px; border: 3px solid #2b2140; border-radius: 10px; background: #fff7e8; overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 40%; background: #ffb62e; border-radius: 6px; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }
      /* Phone held upright: the game is wide, so ask the player to turn the phone. */
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" role="status"><h1>Bridge It!</h1><div class="bar"><i></i></div></div>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 96 96" aria-hidden="true"><rect x="28" y="8" width="40" height="80" rx="8" fill="#3c8dff" stroke="#2b2140" stroke-width="5"/><rect x="34" y="18" width="28" height="52" rx="3" fill="#bfe8ff"/><circle cx="48" cy="79" r="4" fill="#2b2140"/></svg>
      <p>Turn your phone sideways to play</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
